<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Open Graph Meta Tags for Discord -->
<meta property="og:title" content="this is a test title" />
<meta property="og:description" content="<script>aleart(1)<script>" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://brilliant-m.github.io/testCases/" />
<meta property="og:image" content="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop" />
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Discord Embed UI</title>
<style>
  /* Base page styling to show off the embed */
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #1e1f22; /* Darker Discord background */
    font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #dbdee1;
    padding: 20px;
  }

  /* Container to mimic a Discord chat message */
  .discord-message {
    max-width: 600px;
    width: 100%;
  }

  /* The raw URL link above the embed */
  .message-link {
    color: #00a8fc;
    text-decoration: none;
    font-size: 16px;
    line-height: 1.375rem;
    display: block;
    margin-bottom: 8px;
    word-break: break-all;
  }

  .message-link:hover {
    text-decoration: underline;
  }

  /* The main embed block */
  .embed {
    background-color: #2b2d31; /* Discord embed background */
    border-radius: 4px;
    border-left: 4px solid #1e1f22; /* Discord embed left accent bar */
    padding: 12px 16px 16px 12px;
    display: grid;
    grid-template-columns: 1fr auto; /* Text on left, image on right */
    gap: 16px;
    box-sizing: border-box;
  }

  /* Text container */
  .embed-content {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0; /* Prevents flex items from overflowing */
  }

  /* The embed title */
  .embed-title {
    color: #00a8fc;
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.375rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .embed-title:hover {
    text-decoration: underline;
  }

  /* The embed description */
  .embed-description {
    color: #dbdee1;
    font-size: 14px;
    line-height: 1.125rem;
    font-weight: 400;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap;
  }

  /* The thumbnail image on the right */
  .embed-thumbnail {
    width: 80px;
    height: 80px;
    border-radius: 4px;
    object-fit: cover;
    background-color: #1e1f22; /* fallback color */
  }

  /* Simple responsive adjustment for very small screens */
  @media (max-width: 400px) {
    .embed {
      grid-template-columns: 1fr;
    }
    .embed-thumbnail {
      width: 60px;
      height: 60px;
    }
  }
</style>
</head>
<body>

  <div class="discord-message">
    <!-- The raw link -->
    <a href="https://adguard.com/en/adguard-temp-mail/overview.html" target="_blank" class="message-link">
      https://adguard.com/en/adguard-temp-mail/overview.html
    </a>

    <!-- The Rich Embed Card -->
    <div class="embed">
      <div class="embed-content">
        <!-- The title (You requested "this is a test title") -->
        <a href="https://adguard.com/en/adguard-temp-mail/overview.html" target="_blank" class="embed-title">
          this is a test title
        </a>
        
        <!-- The description -->
        <div class="embed-description">
          Get a free disposable email address to prevent spam and protect your data. Learn how to use a temporary email address generator
        </div>
      </div>

      <!-- The thumbnail image -->
      <img 
        src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=200&auto=format&fit=crop" 
        alt="Embed Thumbnail" 
        class="embed-thumbnail"
      >
    </div>
  </div>

</body>
</html>
